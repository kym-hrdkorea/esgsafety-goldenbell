<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 앱 아이콘 / 파비콘 — 손으로 작성한 벡터. design/image-assets.md 1-1
       종 실루엣은 components/BellIcon.tsx의 경로를 그대로 확대해 앱 안의 종과 동일하게 맞췄다.
       16px에서도 읽히도록 종을 크게 두고 장식을 뺐다. -->
  <defs>
    <clipPath id="band">
      <rect x="0" y="856" width="1024" height="168" />
    </clipPath>
  </defs>

  <!-- 바탕: 화면 배경과 같은 딥 네이비 -->
  <rect width="1024" height="1024" rx="104" fill="#12172b" />

  <!-- 하단 해저드 스트라이프 — 앱 최상단 10px 스트라이프와 같은 45도 패턴 -->
  <g clip-path="url(#band)">
    <rect x="0" y="856" width="1024" height="168" fill="#0b0f1d" />
    <g fill="#FFD400">
      <path d="M-140 1044 L 44 824 L 172 824 L -12 1044 Z" />
      <path d="M 116 1044 L 300 824 L 428 824 L 244 1044 Z" />
      <path d="M 372 1044 L 556 824 L 684 824 L 500 1044 Z" />
      <path d="M 628 1044 L 812 824 L 940 824 L 756 1044 Z" />
      <path d="M 884 1044 L 1068 824 L 1196 824 L 1012 1044 Z" />
    </g>
  </g>

  <!-- 종: 브라스 골드(성취색). BellIcon 경로를 확대해 스트라이프 위 영역 중앙에 둔다 -->
  <g transform="translate(44, -13) scale(39)" fill="#C9A227">
    <path d="M12 3c-3.1 0-5.2 2.3-5.2 5.4v3.4L5 14.4v1.2h14v-1.2l-1.8-2.6V8.4C17.2 5.3 15.1 3 12 3z" />
    <path d="M10.2 17.4a1.9 1.9 0 0 0 3.6 0h-3.6z" />
  </g>
</svg>
