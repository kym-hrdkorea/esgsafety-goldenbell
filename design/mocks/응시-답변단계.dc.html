<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0f1d; }
  body { -webkit-font-smoothing: antialiased; }
  a { color: #FFD400; text-decoration: none; }
  a:hover { color: #FFE873; }
  button { font-family: inherit; }
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  @keyframes hz-shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-1.5px); } 75% { transform: translateX(1.5px); } }
  @keyframes hz-slide { from { background-position: 0 0; } to { background-position: 32px 0; } }
</style>
</helmet>
<div style="min-height: 100vh; background: #0b0f1d; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; word-break: keep-all; color: #EDF0F7; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 24px 16px 56px;">

  <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;">
      <div style="font-size: 11px; letter-spacing: 0.22em; color: #FFD400; font-weight: 700;">시안 1a · 응시 — 답변 단계</div>
      <div style="font-size: 12px; color: #8B93AB;">안전·청렴 ON! 골든벨 · 안전 이룸, 함께 해냄</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; background: #131a2e; border: 2px solid #26304f; border-radius: 4px; padding: 14px;">
      <div style="font-size: 12px; letter-spacing: 0.16em; color: #8B93AB; font-weight: 700;">샘플 문항 (실제 배포 문항)</div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{ itemChips }}" as="chip" hint-placeholder-count="6">
          <button type="button" onClick="{{ chip.onClick }}" style="{{ chip.style }}" style-active="transform: translate(1px, 1px);">{{ chip.label }}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 4px;">
        <button type="button" onClick="{{ toggleImminent }}" style="{{ imminentBtnStyle }}" style-active="transform: translate(1px, 1px);">타이머 임박(10초 이하)</button>
        <button type="button" onClick="{{ resetTimer }}" style="min-height: 34px; padding: 0 12px; background: transparent; border: 2px solid #2f3a5e; border-radius: 3px; color: #9AA4C2; font-size: 12px; font-weight: 700; cursor: pointer;" style-active="transform: translate(1px, 1px);">45초로 되돌리기</button>
        <div style="flex: 1;"></div>
        <div style="display: flex; gap: 10px; font-size: 12px; font-weight: 700;"><a href="응시-해설단계.dc.html">해설 단계 →</a><a href="대시보드.dc.html">대시보드 →</a><a href="홈.dc.html">홈 →</a><a href="회차결과.dc.html">회차 결과 →</a><a href="회원가입.dc.html">회원가입 →</a></div>
      </div>
    </div>
  </div>

  <div style="width: 390px; max-width: 100%; border: 4px solid #FFD400; border-radius: 6px; background: #12172b; box-shadow: 10px 10px 0 #05070f; overflow: hidden;">
    <div style="height: 10px; background-image: repeating-linear-gradient(45deg, #FFD400 0 8px, #12172b 8px 16px);"></div>

    <div style="height: 792px; display: flex; flex-direction: column; background: #12172b;">

      <div style="padding: 14px 16px 12px; background: #161d33; border-bottom: 3px solid #262f4d; display: flex; flex-direction: column; gap: 11px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
            <div style="width: 4px; height: 15px; background: #FFD400;"></div>
            <div style="font-size: 13px; font-weight: 700; color: #C6CEE4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ roundLabel }}</div>
          </div>
          <div style="display: flex; align-items: baseline; gap: 2px; font-family: 'Chakra Petch', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-weight: 700;">
            <span style="font-size: 22px; color: #FFD400; line-height: 1;">{{ qnoPadded }}</span>
            <span style="font-size: 15px; color: #5E6A8C; line-height: 1;">/ 12</span>
          </div>
        </div>

        <div style="display: flex; gap: 3px;">
          <sc-for list="{{ progressBlocks }}" as="blk" hint-placeholder-count="12">
            <div style="{{ blk.style }}"></div>
          </sc-for>
        </div>

        <div style="display: flex; align-items: center; gap: 10px;">
          <div style="{{ gaugeWrapStyle }}">
            <div style="{{ gaugeFillStyle }}"></div>
            <div style="position: absolute; inset: 0; background-image: repeating-linear-gradient(90deg, transparent 0 14px, #161d33 14px 17px);"></div>
          </div>
          <div style="{{ timerChipStyle }}">
            <span style="font-family: 'Chakra Petch', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-weight: 700; font-size: 26px; line-height: 1;">{{ secsText }}</span>
            <span style="font-size: 12px; font-weight: 700; padding-bottom: 2px;">{{ secsSuffix }}</span>
          </div>
        </div>
      </div>

      <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 18px 16px 8px; display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; flex-direction: column; gap: 10px;">
          <div style="align-self: flex-start; font-size: 11px; font-weight: 700; letter-spacing: 0.12em; color: #12172b; background: #C9A227; padding: 4px 8px; border-radius: 2px;">{{ typeLabel }}</div>
          <h1 style="margin: 0; font-size: 22px; line-height: 1.52; font-weight: 700; color: #FFFFFF; letter-spacing: -0.012em; text-wrap: pretty; word-break: keep-all;">{{ stem }}</h1>
        </div>

        <sc-if value="{{ isChoice }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <sc-for list="{{ choiceRows }}" as="row" hint-placeholder-count="4">
              <button type="button" onClick="{{ row.onClick }}" style="{{ row.style }}" style-active="transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(0,0,0,0.6);">
                <span style="{{ row.badgeStyle }}">{{ row.badge }}</span>
                <span style="flex: 1; text-align: left; text-wrap: pretty;">{{ row.label }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ isOx }}" hint-placeholder-val="{{ false }}">
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px;">
            <sc-for list="{{ oxRows }}" as="row" hint-placeholder-count="2">
              <button type="button" onClick="{{ row.onClick }}" style="{{ row.style }}" style-active="transform: translate(4px, 4px); box-shadow: 1px 1px 0 rgba(0,0,0,0.6);">
                <span style="font-family: 'Chakra Petch', ui-monospace, monospace; font-weight: 700; font-size: 64px; line-height: 1;">{{ row.label }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ isOrder }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 10px;">
            <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
              <div style="font-size: 13px; font-weight: 700; color: #FFD400;">순서대로 눌러 주세요</div>
              <button type="button" onClick="{{ resetOrder }}" style="min-height: 48px; padding: 0 16px; background: transparent; border: 2px solid #3a4468; border-radius: 3px; color: #C6CEE4; font-size: 14px; font-weight: 700; cursor: pointer;" style-active="transform: translate(1px, 1px);">다시 선택</button>
            </div>
            <sc-for list="{{ orderRows }}" as="row" hint-placeholder-count="5">
              <button type="button" onClick="{{ row.onClick }}" style="{{ row.style }}" style-active="transform: translate(3px, 3px); box-shadow: 1px 1px 0 rgba(0,0,0,0.6);">
                <span style="{{ row.badgeStyle }}">{{ row.badge }}</span>
                <span style="flex: 1; text-align: left; text-wrap: pretty;">{{ row.label }}</span>
              </button>
            </sc-for>
          </div>
        </sc-if>

        <sc-if value="{{ isShort }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <input type="text" value="{{ shortValue }}" onChange="{{ onShortChange }}" placeholder="정답을 입력하세요" style="width: 100%; box-sizing: border-box; min-height: 56px; padding: 0 16px; background: #1b2239; border: 3px solid #3a4468; border-radius: 4px; box-shadow: 4px 4px 0 #070a16; color: #FFFFFF; font-size: 18px; font-weight: 700; outline: none;" style-focus="border-color: #FFD400;" />
          </div>
        </sc-if>
      </div>

      <div style="padding: 10px 16px 16px; background: #161d33; border-top: 3px solid #262f4d; display: flex; flex-direction: column; gap: 8px;">
        <div style="{{ hintStyle }}">
          <span style="font-family: 'Chakra Petch', ui-monospace, monospace; font-weight: 700;">!</span>
          <span>답을 선택해 주세요</span>
        </div>
        <button type="button" onClick="{{ submit }}" style="{{ submitStyle }}" style-active="transform: translate(4px, 4px); box-shadow: 1px 1px 0 rgba(0,0,0,0.6);">제출하기</button>
      </div>
    </div>
  </div>

  <div style="width: 390px; max-width: 100%; font-size: 13px; line-height: 1.7; color: #8B93AB;">{{ note }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:1080}}">
const ITEMS = [
  { code: '1-01', type: 'ox', qno: 1, round: '3회차 · 심폐소생술', typeLabel: 'O / X',
    stem: '심정지 환자를 발견했을 때 가슴압박은 분당 100~120회 속도로 실시한다.' },
  { code: '1-06', type: 'choice', qno: 2, round: '3회차 · 화재예방', typeLabel: '4지선다',
    stem: '전기설비에서 발생한 화재는 몇 급 화재인가?',
    options: ['A급', 'B급', 'C급', 'K급'] },
  { code: '2-04', type: 'choice', qno: 5, round: '3회차 · 온열질환', typeLabel: '4지선다',
    stem: '폭염작업 시 체감온도가 33℃ 이상인 경우 사업주가 부여해야 하는 휴식 기준은?',
    options: ['하루 1회 30분 이상', '2시간마다 20분 이상', '4시간마다 10분 이상', '권고사항일 뿐 의무는 아니다'] },
  { code: '4-02', type: 'choice', qno: 7, round: '3회차 · 사무실 안전', typeLabel: '4지선다',
    stem: '사무실에서 바닥에 늘어진 전선을 발견했다. 가장 바람직한 행동은?',
    options: ['못 본 척한다', '나만 조심해서 지나간다', '즉시 정리할 수 있으면 정리하고, 구조적 문제면 신고한다', '부서 회의 때 안건으로 올린다'] },
  { code: '7-03', type: 'order', qno: 11, round: '3회차 · 위험성평가', typeLabel: '순서배열',
    stem: '위험성평가의 실시 절차를 순서대로 배열하시오.',
    options: ['위험성 결정', '사전준비', '위험성평가 공유 및 기록·보존', '유해·위험요인 파악', '감소대책 수립 및 실행'] },
  { code: '1-04', type: 'short', qno: 12, round: '3회차 · 안전 기본', typeLabel: '단답',
    stem: '사고로 이어지지는 않았지만 사고가 날 수 있었던 위험한 순간을 뜻하는 안전 용어는? (영어로 near miss)' }
];

const NOTES = {
  '1-01': 'OX · 큰 버튼 2개. 선택 상태는 노랑 채움 + 눌린 그림자로 구분됩니다.',
  '1-06': '가장 짧은 4지선다. 선택지가 3~4자여도 카드 높이는 48px 이상을 유지합니다.',
  '2-04': '★ 가장 긴 문항 + 선택지 + 해설 케이스. 답변 단계는 스크롤 없이 한 화면에 들어갑니다.',
  '4-02': '★ 선택지 한 줄이 2줄로 줄바꿈되어도 번호 배지와 선택 상태 표시가 유지됩니다.',
  '7-03': '★ 순서배열 5항목. 탭하면 번호 배지가 붙고, 다시 탭하면 해제됩니다. 드래그 없음.',
  '1-04': '단답 1줄 입력. 입력란은 문항 바로 아래에 두어 키보드가 올라와도 문항이 보입니다.'
};

const NUM = "'Chakra Petch', ui-monospace, monospace";

class Component extends DCLogic {
  state = { idx: 2, sel: null, order: [], short: '', secs: 45, tried: false };

  componentDidMount() {
    this.t = setInterval(() => {
      this.setState(s => ({ secs: s.secs > 0 ? s.secs - 1 : 0 }));
    }, 1000);
  }
  componentWillUnmount() { clearInterval(this.t); }

  get item() { return ITEMS[this.state.idx] || ITEMS[0]; }

  pickItem(i) { this.setState({ idx: i, sel: null, order: [], short: '', tried: false, secs: 45 }); }
  pick(i) { this.setState({ sel: i, tried: false }); }
  tapOrder(i) {
    this.setState(s => {
      const at = s.order.indexOf(i);
      return { order: at >= 0 ? s.order.filter(x => x !== i) : s.order.concat([i]), tried: false };
    });
  }

  get answered() {
    const it = this.item, s = this.state;
    if (it.type === 'order') return s.order.length === it.options.length;
    if (it.type === 'short') return s.short.trim().length > 0;
    return s.sel !== null;
  }

  cardStyle(on, minH) {
    return on
      ? 'display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:' + minH + 'px;padding:13px 14px;background:#FFD400;border:3px solid #FFE873;border-radius:4px;box-shadow:2px 2px 0 #6B5200;transform:translate(2px,2px);color:#12172b;font-size:17px;font-weight:700;line-height:1.5;cursor:pointer;word-break:keep-all;text-align:left;'
      : 'display:flex;align-items:center;gap:12px;width:100%;box-sizing:border-box;min-height:' + minH + 'px;padding:13px 14px;background:#1b2239;border:3px solid #3a4468;border-radius:4px;box-shadow:4px 4px 0 #070a16;color:#EDF0F7;font-size:17px;font-weight:500;line-height:1.5;cursor:pointer;word-break:keep-all;text-align:left;';
  }
  badgeStyle(on) {
    return 'flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:2px;font-family:' + NUM + ';font-variant-numeric:tabular-nums;font-weight:700;font-size:16px;' +
      (on ? 'background:#12172b;color:#FFD400;' : 'background:#2a3252;color:#8B93AB;');
  }

  renderVals() {
    const s = this.state, it = this.item, imminent = s.secs <= 10;

    const itemChips = ITEMS.map((x, i) => ({
      label: x.code,
      onClick: () => this.pickItem(i),
      style: 'min-height:34px;padding:0 12px;border-radius:3px;font-family:' + NUM + ';font-weight:700;font-size:13px;cursor:pointer;border:2px solid ' +
        (i === s.idx ? '#FFD400;background:#FFD400;color:#12172b;' : '#2f3a5e;background:#0f1425;color:#9AA4C2;')
    }));

    const progressBlocks = Array.from({ length: 12 }, (_, i) => {
      const n = i + 1;
      let bg = '#232b47';
      if (n < it.qno) bg = '#C9A227';
      if (n === it.qno) bg = '#FFD400';
      return { style: 'flex:1;height:8px;border-radius:1px;background:' + bg + (n === it.qno ? ';box-shadow:0 0 0 2px #12172b, 0 0 0 3px #FFD400;' : ';') };
    });

    const pct = Math.max(0, Math.min(100, s.secs / 45 * 100));
    const gaugeFillStyle = 'position:absolute;top:0;left:0;bottom:0;width:' + pct + '%;transition:width 1s linear;' +
      (imminent
        ? 'background-image:repeating-linear-gradient(45deg,#FFD400 0 8px,#0b0f1d 8px 16px);background-size:23px 23px;animation:hz-slide 1s linear infinite;'
        : 'background:#FFD400;');

    const choiceRows = (it.options || []).map((label, i) => ({
      label, badge: String(i + 1), onClick: () => this.pick(i),
      style: this.cardStyle(s.sel === i, 56), badgeStyle: this.badgeStyle(s.sel === i)
    }));

    const oxRows = ['O', 'X'].map((label, i) => ({
      label, onClick: () => this.pick(i),
      style: 'display:flex;align-items:center;justify-content:center;height:150px;border-radius:4px;cursor:pointer;' +
        (s.sel === i
          ? 'background:#FFD400;border:4px solid #FFE873;box-shadow:3px 3px 0 #6B5200;transform:translate(2px,2px);color:#12172b;'
          : 'background:#1b2239;border:4px solid #3a4468;box-shadow:6px 6px 0 #070a16;color:#C6CEE4;')
    }));

    const orderRows = (it.options || []).map((label, i) => {
      const at = s.order.indexOf(i), picked = at >= 0;
      return {
        label, badge: picked ? String(at + 1) : '·', onClick: () => this.tapOrder(i),
        style: this.cardStyle(picked, 54), badgeStyle: this.badgeStyle(picked)
      };
    });

    const ready = this.answered;

    return {
      roundLabel: it.round,
      typeLabel: it.typeLabel,
      stem: it.stem,
      qnoPadded: String(it.qno).padStart(2, '0'),
      note: NOTES[it.code],
      itemChips, progressBlocks, gaugeFillStyle, choiceRows, oxRows, orderRows,
      isChoice: it.type === 'choice',
      isOx: it.type === 'ox',
      isOrder: it.type === 'order',
      isShort: it.type === 'short',
      shortValue: s.short,
      onShortChange: e => this.setState({ short: e.target.value, tried: false }),
      resetOrder: () => this.setState({ order: [] }),
      resetTimer: () => this.setState({ secs: 45 }),
      toggleImminent: () => this.setState(st => ({ secs: st.secs <= 10 ? 45 : 8 })),
      imminentBtnStyle: 'min-height:34px;padding:0 12px;border-radius:3px;font-size:12px;font-weight:700;cursor:pointer;border:2px solid ' +
        (imminent ? '#E23A2E;background:#E23A2E;color:#fff;' : '#2f3a5e;background:#0f1425;color:#9AA4C2;'),
      secsText: String(s.secs),
      secsSuffix: imminent ? '초 남음' : '초',
      gaugeWrapStyle: 'flex:1;position:relative;overflow:hidden;height:18px;border-radius:2px;border:2px solid ' +
        (imminent ? '#FFD400;' : '#2f3a5e;') + 'background:#12172b;',
      timerChipStyle: 'flex:0 0 auto;display:flex;align-items:baseline;justify-content:flex-end;gap:3px;min-width:78px;padding:4px 9px;border-radius:3px;' +
        (imminent
          ? 'background:#E23A2E;color:#FFFFFF;animation:hz-shake 0.5s ease-in-out infinite;'
          : 'background:#12172b;color:#FFD400;'),
      hintStyle: 'display:flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:#FFD400;min-height:18px;visibility:' +
        (s.tried && !ready ? 'visible;' : 'hidden;'),
      submit: () => { if (!ready) this.setState({ tried: true }); },
      submitStyle: 'width:100%;min-height:56px;border-radius:4px;font-size:19px;font-weight:800;letter-spacing:0.02em;cursor:pointer;' +
        (ready
          ? 'background:#FFD400;border:3px solid #FFE873;box-shadow:5px 5px 0 #6B5200;color:#12172b;'
          : 'background:#232b47;border:3px solid #2f3a5e;box-shadow:none;color:#6F7A9B;')
    };
  }
}
</script>
</body>
</html>
