<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0b0f1d; }
  body { -webkit-font-smoothing: antialiased; }
  a { color: #FFD400; text-decoration: none; }
  a:hover { color: #FFE873; }
  button { font-family: inherit; }
  * { scrollbar-width: none; }
  *::-webkit-scrollbar { display: none; width: 0; height: 0; }
  @keyframes bell-swing { 0% { transform: rotate(0deg); } 20% { transform: rotate(-14deg); } 45% { transform: rotate(11deg); } 70% { transform: rotate(-5deg); } 100% { transform: rotate(0deg); } }
  @keyframes ring-out { from { transform: scale(0.55); opacity: 0.9; } to { transform: scale(1.45); opacity: 0; } }
  @keyframes rise-in { from { transform: translateY(8px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</helmet>
<div style="min-height: 100vh; background: #0b0f1d; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Malgun Gothic', 'Noto Sans KR', sans-serif; word-break: keep-all; color: #EDF0F7; display: flex; flex-direction: column; align-items: center; gap: 20px; padding: 24px 16px 56px;">

  <div style="width: 100%; max-width: 720px; display: flex; flex-direction: column; gap: 14px;">
    <div style="display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap;">
      <div style="font-size: 11px; letter-spacing: 0.22em; color: #FFD400; font-weight: 700;">시안 2a · 응시 — 해설 단계</div>
      <div style="font-size: 12px; color: #8B93AB;">정답 · 오답 · 시간초과 3가지 상태</div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px; background: #131a2e; border: 2px solid #26304f; border-radius: 4px; padding: 14px;">
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
        <div style="font-size: 12px; letter-spacing: 0.16em; color: #8B93AB; font-weight: 700; margin-right: 4px;">상태</div>
        <sc-for list="{{ stateChips }}" as="chip" hint-placeholder-count="3">
          <button type="button" onClick="{{ chip.onClick }}" style="{{ chip.style }}" style-active="transform: translate(1px, 1px);">{{ chip.label }}</button>
        </sc-for>
      </div>
      <div style="display: flex; flex-wrap: wrap; gap: 8px; align-items: center;">
        <div style="font-size: 12px; letter-spacing: 0.16em; color: #8B93AB; font-weight: 700; margin-right: 4px;">문항</div>
        <sc-for list="{{ itemChips }}" as="chip" hint-placeholder-count="6">
          <button type="button" onClick="{{ chip.onClick }}" style="{{ chip.style }}" style-active="transform: translate(1px, 1px);">{{ chip.label }}</button>
        </sc-for>
        <div style="flex: 1;"></div>
        <div style="display: flex; gap: 10px; font-size: 12px; font-weight: 700;"><a href="응시-답변단계.dc.html">← 답변 단계</a><a href="대시보드.dc.html">대시보드 →</a><a href="홈.dc.html">홈 →</a><a href="회차결과.dc.html">회차 결과 →</a></div>
      </div>
    </div>
  </div>

  <div style="width: 390px; max-width: 100%; border: 4px solid #FFD400; border-radius: 6px; background: #12172b; box-shadow: 10px 10px 0 #05070f; overflow: hidden;">
    <div style="height: 10px; background-image: repeating-linear-gradient(45deg, #FFD400 0 8px, #12172b 8px 16px);"></div>

    <div style="height: 792px; display: flex; flex-direction: column; background: #12172b;">

      <div style="padding: 14px 16px 12px; background: #161d33; border-bottom: 3px solid #262f4d; display: flex; flex-direction: column; gap: 11px;">
        <div style="display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="display: flex; align-items: center; gap: 8px; min-width: 0;">
            <div style="width: 4px; height: 15px; background: #FFD400;"></div>
            <div style="font-size: 13px; font-weight: 700; color: #C6CEE4; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">{{ roundLabel }}</div>
          </div>
          <div style="display: flex; align-items: baseline; gap: 2px; font-family: 'Chakra Petch', ui-monospace, monospace; font-variant-numeric: tabular-nums; font-weight: 700;">
            <span style="font-size: 22px; color: #FFD400; line-height: 1;">{{ qnoPadded }}</span>
            <span style="font-size: 15px; color: #5E6A8C; line-height: 1;">/ 12</span>
          </div>
        </div>
        <div style="display: flex; gap: 3px;">
          <sc-for list="{{ progressBlocks }}" as="blk" hint-placeholder-count="12">
            <div style="{{ blk.style }}"></div>
          </sc-for>
        </div>
      </div>

      <div style="flex: 1; min-height: 0; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 16px;">

        <sc-if value="{{ isCorrect }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #12261a; border: 3px solid #24B24C; border-radius: 4px; box-shadow: 4px 4px 0 #070a16; animation: rise-in 0.25s ease-out;">
            <div style="position: relative; width: 52px; height: 52px; flex: 0 0 auto;">
              <span style="position: absolute; inset: 0; border: 2px solid #C9A227; border-radius: 50%; animation: ring-out 0.8s ease-out 0.1s both;"></span>
              <span style="position: absolute; inset: 0; border: 2px solid #FFD400; border-radius: 50%; animation: ring-out 1.1s ease-out 0.25s both;"></span>
              <div style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #C9A227; border-radius: 50%; border: 2px solid #FFE873;">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" style="animation: bell-swing 0.9s ease-in-out 0.15s both; transform-origin: 50% 12%;"><path d="M12 3c-3.1 0-5.2 2.3-5.2 5.4v3.4L5 14.4v1.2h14v-1.2l-1.8-2.6V8.4C17.2 5.3 15.1 3 12 3z" fill="#12172b"></path><path d="M10.2 17.4a1.9 1.9 0 0 0 3.6 0h-3.6z" fill="#12172b"></path></svg>
              </div>
            </div>
            <div style="display: flex; flex-direction: column; gap: 3px;">
              <div style="font-size: 21px; font-weight: 800; color: #7CE09A; letter-spacing: -0.01em;">정답입니다</div>
              <div style="display: flex; align-items: baseline; gap: 4px; font-family: 'Chakra Petch', ui-monospace, monospace; font-weight: 700; color: #C9A227;"><span style="font-size: 16px;">+1</span><span style="font-size: 12px; color: #5E6A8C;">SCORE</span></div>
            </div>
          </div>
        </sc-if>

        <sc-if value="{{ isWrong }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #2a171a; border: 3px solid #E23A2E; border-radius: 4px; box-shadow: 4px 4px 0 #070a16; animation: rise-in 0.25s ease-out;">
            <div style="width: 44px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: #E23A2E; border-radius: 3px;">
              <svg width="22" height="22" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke="#fff" stroke-width="3.2" stroke-linecap="round"></path></svg>
            </div>
            <div style="font-size: 21px; font-weight: 800; color: #F0A099; letter-spacing: -0.01em;">아쉽습니다</div>
          </div>
        </sc-if>

        <sc-if value="{{ isTimeout }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 14px; padding: 16px; background: #1b2136; border: 3px solid #5E6A8C; border-radius: 4px; box-shadow: 4px 4px 0 #070a16; animation: rise-in 0.25s ease-out;">
            <div style="width: 44px; height: 44px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; background: #3a4468; border-radius: 3px;">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="8.5" stroke="#C6CEE4" stroke-width="2.4"></circle><path d="M12 7.5V12l3 2.2" stroke="#C6CEE4" stroke-width="2.4" stroke-linecap="round"></path></svg>
            </div>
            <div style="font-size: 21px; font-weight: 800; color: #C6CEE4; letter-spacing: -0.01em;">시간이 초과되었습니다</div>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 10px;">
          <h1 style="margin: 0; font-size: 19px; line-height: 1.5; font-weight: 700; color: #FFFFFF; letter-spacing: -0.012em; text-wrap: pretty;">{{ stem }}</h1>
          <div style="display: flex; align-items: baseline; gap: 8px; padding: 10px 12px; background: #161d33; border-left: 4px solid #C9A227; border-radius: 0 3px 3px 0;">
            <span style="font-size: 13px; font-weight: 800; color: #C9A227; white-space: nowrap;">정답</span>
            <span style="font-size: 16px; font-weight: 700; color: #FFFFFF;">{{ answerText }}</span>
          </div>
        </div>

        <sc-if value="{{ isChoiceLike }}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; flex-direction: column; gap: 8px;">
            <sc-for list="{{ recapRows }}" as="row" hint-placeholder-count="4">
              <div style="{{ row.style }}">
                <span style="{{ row.badgeStyle }}">{{ row.badge }}</span>
                <span style="flex: 1; text-align: left; text-wrap: pretty;">{{ row.label }}</span>
                <sc-if value="{{ row.mark }}" hint-placeholder-val="{{ false }}">
                  <span style="{{ row.markStyle }}">{{ row.markGlyph }}</span>
                </sc-if>
              </div>
            </sc-for>
            <sc-if value="{{ myAnswerLine }}" hint-placeholder-val="{{ false }}">
              <div style="font-size: 13px; font-weight: 700; color: #F0A099; padding: 2px 2px 0;">{{ myAnswerLine }}</div>
            </sc-if>
          </div>
        </sc-if>

        <div style="display: flex; flex-direction: column; gap: 8px;">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 4px; height: 13px; background: #FFD400;"></div>
            <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #C6CEE4;">해설</div>
          </div>
          <p style="margin: 0; font-size: 16px; line-height: 1.65; color: #C9D2E8; text-wrap: pretty;">{{ explain }}</p>
        </div>

        <sc-if value="{{ refText }}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; flex-direction: column; gap: 8px; padding-bottom: 8px;">
            <div style="display: flex; align-items: center; gap: 8px;">
              <div style="width: 4px; height: 13px; background: #5E6A8C;"></div>
              <div style="font-size: 13px; font-weight: 800; letter-spacing: 0.08em; color: #8B93AB;">근거</div>
            </div>
            <div style="font-size: 14px; color: #8B93AB; font-variant-numeric: tabular-nums;">{{ refText }}</div>
          </div>
        </sc-if>
      </div>

      <div style="padding: 10px 16px 16px; background: #161d33; border-top: 3px solid #262f4d;">
        <button type="button" onClick="{{ next }}" style="width: 100%; min-height: 56px; border-radius: 4px; font-size: 19px; font-weight: 800; letter-spacing: 0.02em; cursor: pointer; background: #FFD400; border: 3px solid #FFE873; box-shadow: 5px 5px 0 #6B5200; color: #12172b;" style-active="transform: translate(4px, 4px); box-shadow: 1px 1px 0 rgba(0,0,0,0.6);">{{ ctaLabel }}</button>
      </div>
    </div>
  </div>

  <div style="width: 390px; max-width: 100%; font-size: 13px; line-height: 1.7; color: #8B93AB;">{{ note }}</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:760,&quot;height&quot;:1120}}">
const ITEMS = [
  { code: '1-01', type: 'ox', qno: 1, round: '3회차 · 심폐소생술',
    stem: '심정지 환자를 발견했을 때 가슴압박은 분당 100~120회 속도로 실시한다.',
    options: ['O', 'X'], correct: 0, wrongPick: 1, answerText: 'O',
    explain: '너무 느리면 혈액순환이 되지 않고, 너무 빠르면 압박 깊이가 얕아집니다.',
    ref: '2020 한국형 심폐소생술 가이드라인' },
  { code: '1-06', type: 'choice', qno: 2, round: '3회차 · 화재예방',
    stem: '전기설비에서 발생한 화재는 몇 급 화재인가?',
    options: ['A급', 'B급', 'C급', 'K급'], correct: 2, wrongPick: 0, answerText: 'C급',
    explain: 'A급=일반, B급=유류, C급=전기, K급=주방(식용유). 사무실 비치 분말소화기는 통상 ABC 겸용입니다.',
    ref: '' },
  { code: '2-04', type: 'choice', qno: 5, round: '3회차 · 온열질환',
    stem: '폭염작업 시 체감온도가 33℃ 이상인 경우 사업주가 부여해야 하는 휴식 기준은?',
    options: ['하루 1회 30분 이상', '2시간마다 20분 이상', '4시간마다 10분 이상', '권고사항일 뿐 의무는 아니다'],
    correct: 1, wrongPick: 3, answerText: '2시간마다 20분 이상',
    explain: "2025년 7월 17일부터 법령상 의무입니다. 체감온도 31℃ 이상이 '폭염작업'의 기준이고, 33℃ 이상이면 2시간마다 최소 20분(또는 1시간마다 10분) 휴식을 주어야 합니다.",
    ref: '안전보건규칙 §559' },
  { code: '4-02', type: 'choice', qno: 7, round: '3회차 · 사무실 안전',
    stem: '사무실에서 바닥에 늘어진 전선을 발견했다. 가장 바람직한 행동은?',
    options: ['못 본 척한다', '나만 조심해서 지나간다', '즉시 정리할 수 있으면 정리하고, 구조적 문제면 신고한다', '부서 회의 때 안건으로 올린다'],
    correct: 2, wrongPick: 1, answerText: '즉시 정리할 수 있으면 정리하고, 구조적 문제면 신고한다',
    explain: '내가 지금 없앨 수 있는 위험은 바로 없애고, 혼자 해결할 수 없는 것은 신고합니다. 발견-조치-신고가 안전관리의 기본 순환입니다.',
    ref: '' },
  { code: '7-03', type: 'order', qno: 11, round: '3회차 · 위험성평가',
    stem: '위험성평가의 실시 절차를 순서대로 배열하시오.',
    options: ['위험성 결정', '사전준비', '위험성평가 공유 및 기록·보존', '유해·위험요인 파악', '감소대책 수립 및 실행'],
    correctSeq: [1, 3, 0, 4, 2], wrongSeq: [1, 3, 4, 0, 2], answerText: '2 → 4 → 1 → 5 → 3',
    explain: "2023년 개정 고시부터 '위험성 추정' 단계가 삭제되고 5단계로 정비되었습니다.",
    ref: '사업장 위험성평가에 관한 지침' },
  { code: '1-04', type: 'short', qno: 12, round: '3회차 · 안전 기본',
    stem: '사고로 이어지지는 않았지만 사고가 날 수 있었던 위험한 순간을 뜻하는 안전 용어는? (영어로 near miss)',
    answerText: '아차사고', wrongText: '니어미스',
    explain: '큰 사고 1건 뒤에는 경상 29건, 무상해 아차사고 300건이 있습니다(하인리히 법칙). 아차사고를 줄이면 큰 사고가 줄어듭니다.',
    ref: '' }
];

const STATES = [
  { key: 'correct', label: '정답' },
  { key: 'wrong', label: '오답' },
  { key: 'timeout', label: '시간초과' }
];

const NOTES = {
  correct: '정답 배너에만 아케이드 연출(골든벨 링 모션)을 씁니다. 300ms 이내, 1회 재생.',
  wrong: '오답은 짧고 담담하게. 배너 아래에 정답과 내가 고른 답을 함께 표시합니다.',
  timeout: "시간초과는 중립 톤입니다. 'GAME OVER' 류의 연출 없이 정답과 해설로 바로 연결합니다."
};

const NUM = "'Chakra Petch', ui-monospace, monospace";

class Component extends DCLogic {
  state = { st: 'correct', idx: 2 };
  get item() { return ITEMS[this.state.idx] || ITEMS[0]; }

  chipStyle(on, accent) {
    const a = accent || '#FFD400';
    return 'min-height:34px;padding:0 12px;border-radius:3px;font-weight:700;font-size:13px;cursor:pointer;border:2px solid ' +
      (on ? a + ';background:' + a + ';color:#12172b;' : '#2f3a5e;background:#0f1425;color:#9AA4C2;');
  }

  recapStyle(kind) {
    const base = 'display:flex;align-items:center;gap:10px;width:100%;box-sizing:border-box;min-height:48px;padding:11px 12px;border-radius:4px;font-size:15px;line-height:1.5;text-align:left;';
    if (kind === 'correct') return base + 'background:#12261a;border:3px solid #24B24C;color:#EAF7EE;font-weight:700;';
    if (kind === 'wrong') return base + 'background:#2a171a;border:3px solid #E23A2E;color:#F5D9D6;font-weight:500;';
    return base + 'background:#151b30;border:3px solid #232b47;color:#7A85A6;font-weight:500;';
  }
  recapBadge(kind) {
    return 'flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:2px;font-family:' + NUM + ';font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;' +
      (kind === 'correct' ? 'background:#24B24C;color:#0b0f1d;' : kind === 'wrong' ? 'background:#E23A2E;color:#fff;' : 'background:#232b47;color:#5E6A8C;');
  }
  mark(kind) {
    if (kind === 'correct') return { mark: true, markGlyph: '✓', markStyle: 'flex:0 0 auto;font-weight:900;font-size:17px;color:#7CE09A;' };
    if (kind === 'wrong') return { mark: true, markGlyph: '✕', markStyle: 'flex:0 0 auto;font-weight:900;font-size:15px;color:#F0A099;' };
    return { mark: false, markGlyph: '', markStyle: '' };
  }

  renderVals() {
    const s = this.state, it = this.item, st = s.st;
    const isCorrect = st === 'correct', isWrong = st === 'wrong', isTimeout = st === 'timeout';

    const stateChips = STATES.map(x => ({
      label: x.label,
      onClick: () => this.setState({ st: x.key }),
      style: this.chipStyle(st === x.key, x.key === 'correct' ? '#24B24C' : x.key === 'wrong' ? '#E23A2E' : '#8B93AB')
    }));
    const itemChips = ITEMS.map((x, i) => ({
      label: x.code,
      onClick: () => this.setState({ idx: i }),
      style: 'font-family:' + NUM + ';' + this.chipStyle(i === s.idx)
    }));

    const progressBlocks = Array.from({ length: 12 }, (_, i) => {
      const n = i + 1;
      let bg = '#232b47';
      if (n < it.qno) bg = '#C9A227';
      if (n === it.qno) bg = '#FFD400';
      return { style: 'flex:1;height:8px;border-radius:1px;background:' + bg + (n === it.qno ? ';box-shadow:0 0 0 2px #12172b, 0 0 0 3px #FFD400;' : ';') };
    });

    let recapRows = [], myAnswerLine = false;
    if (it.type === 'choice' || it.type === 'ox') {
      recapRows = it.options.map((label, i) => {
        let kind = 'dim';
        if (i === it.correct) kind = 'correct';
        else if (isWrong && i === it.wrongPick) kind = 'wrong';
        return Object.assign({ label, badge: it.type === 'ox' ? label : String(i + 1), style: this.recapStyle(kind), badgeStyle: this.recapBadge(kind) }, this.mark(kind));
      });
    } else if (it.type === 'order') {
      const seq = isWrong ? it.wrongSeq : it.correctSeq;
      recapRows = seq.map((optIdx, pos) => {
        const kind = isWrong ? (it.correctSeq[pos] === optIdx ? 'correct' : 'wrong') : 'correct';
        return Object.assign({ label: it.options[optIdx], badge: String(pos + 1), style: this.recapStyle(kind), badgeStyle: this.recapBadge(kind) }, this.mark(kind));
      });
      if (isWrong) myAnswerLine = '내 답: 2 → 4 → 5 → 1 → 3';
    } else if (it.type === 'short') {
      recapRows = [Object.assign({ label: it.answerText, badge: '✓', style: this.recapStyle('correct'), badgeStyle: this.recapBadge('correct') }, this.mark('correct'))];
      if (isWrong) myAnswerLine = '내 답: ' + it.wrongText;
    }

    return {
      isCorrect, isWrong, isTimeout,
      roundLabel: it.round,
      qnoPadded: String(it.qno).padStart(2, '0'),
      stem: it.stem,
      answerText: it.answerText,
      explain: it.explain,
      refText: it.ref || false,
      progressBlocks, stateChips, itemChips,
      isChoiceLike: true,
      recapRows, myAnswerLine,
      ctaLabel: it.qno === 12 ? '결과 보기' : '다음 문제',
      next: () => {},
      note: NOTES[st]
    };
  }
}
</script>
